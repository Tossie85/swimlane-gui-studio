<!--
  アクティビティバー用のアイコン（単色）。
  既存の「Swimlane Diagram Preview」拡張のアイコン（スイムレーンの表＋青いフロー）をモチーフに、
  右下にペンを重ねて「GUI で編集するエディタ版」であることを示している。

  ・外枠＋横2本＝レーン（担当）／左のツマミ＝レーンのハンドル
  ・塗りの2つ＝図形ノード、短い線＝フロー
  ・右下のペン＝編集（GUI Studio）

  24px まで小さくしても「表＋ペン」で分かるよう、部品は塗りでシルエットを持たせている。
  VS Code はアイコンを単色で塗り直すので、色は currentColor で形だけを持たせる。
-->
<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
     fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <rect x="3" y="4.5" width="18" height="15" rx="2"/>
  <path d="M3 9.5 h18 M3 14.5 h18"/>
  <rect x="6.4" y="5.8" width="6.6" height="3.4" rx="1.1" fill="currentColor" stroke="none"/>
  <rect x="10.8" y="10.8" width="6.6" height="3.4" rx="1.1" fill="currentColor" stroke="none"/>
  <path d="M9.7 9.2 v3 h1.1"/>
  <g transform="translate(16.9 17.5) rotate(45)" stroke="none" fill="currentColor">
    <rect x="-2.2" y="-9.2" width="4.4" height="7.2" rx="0.9"/>
    <path d="M-2.2 -2 L2.2 -2 L0 2.8 Z"/>
  </g>
</svg>
